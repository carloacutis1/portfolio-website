<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2048 — Henry Cooper</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!-- game.js and style.css are copied unchanged from github.com/carloacutis1/2048.
